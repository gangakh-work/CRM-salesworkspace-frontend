name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          # Vite embeds VITE_* values into the production bundle at build time.
          VITE_ENVIRONMENT: production
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_REDIRECT_URI: ${{ secrets.VITE_MSAL_REDIRECT_URI }}
          VITE_MSAL_API_SCOPE: ${{ secrets.VITE_MSAL_API_SCOPE }}
        run: |
          test -n "$VITE_API_BASE_URL" || (echo "Missing GitHub secret VITE_API_BASE_URL" && exit 1)
          test -n "$VITE_MSAL_CLIENT_ID" || (echo "Missing GitHub secret VITE_MSAL_CLIENT_ID" && exit 1)
          test -n "$VITE_MSAL_TENANT_ID" || (echo "Missing GitHub secret VITE_MSAL_TENANT_ID" && exit 1)
          test -n "$VITE_MSAL_REDIRECT_URI" || (echo "Missing GitHub secret VITE_MSAL_REDIRECT_URI" && exit 1)
          test -n "$VITE_MSAL_API_SCOPE" || (echo "Missing GitHub secret VITE_MSAL_API_SCOPE" && exit 1)
          npm run build

      - name: Copy Azure Static Web Apps configuration
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Verify Build Output
        run: |
          test -f dist/index.html
          echo "Build output:"
          find dist -type f | wc -l

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_FIELD_091A49600 }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_FIELD_091A49600 }}
          action: close
